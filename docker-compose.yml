# Tetra Master for the OpenLobby core. This file is an OVERRIDE, not a stack
# of its own: the title runs inside the core's login and authsess processes,
# so it is applied on top of OpenLobby's compose file, in OpenLobby's project.
#
# With both repositories checked out side by side, from this directory:
#
#   docker compose --project-directory ../openlobby \
#       -f ../openlobby/docker-compose.yml -f docker-compose.yml up -d --build
#
# (put that in a shell alias or use COMPOSE_FILE; see README.md). It replaces
# the core's login and authsess images with this one (the core plus the
# title), and adds the weekly ranking job and, optionally, the live board.
# Everything else - ports, volumes, the other services - is OpenLobby's.
#
# Tetra Master keeps its durable data (tournament standings, the weekly
# champion, the board's Discord bookkeeping) in OpenLobby's PostgreSQL and its
# live state (the room roster, the matches being watched) in OpenLobby's
# Valkey. login and authsess get both from the core's own service entries;
# the two services added here name them and wait for them the same way. Each
# applies Tetra Master's migrations (services/tm_migrations/) at start.
#
# Before the first start: `python tools/tmdata_build.py --client <your
# Tetra Master install>` (the client's parameter tables; see README.md).

services:
  # login builds the title image; authsess consumes it. Exactly one builder,
  # so parallel builds cannot race on the tag.
  login:
    image: crystalmaster:latest
    build:
      context: ../crystalmaster
      args:
        OPENLOBBY_IMAGE: openlobby:latest
    pull_policy: build
    environment:
      POL_TITLES: tmtitle
      # the address a Tetra Master client dials for its zones; empty = the
      # core's POL_ADVERTISE
      POL_TM_ZONE_HOST: "${POL_TM_ZONE_HOST:-}"
      # an event window (unix seconds); -1/-1 = no event, the default
      POL_TM_EVENT_START: "${POL_TM_EVENT_START:--1}"
      POL_TM_EVENT_END: "${POL_TM_EVENT_END:--1}"
      # TOURNAMENTS: the members who see the extra `ENAAB<name>` zone in b/g/ZL
      # that opens the Event List (comma list of member ids, or `*`); empty =
      # no tournament door, the default. The zone's name and its room id.
      POL_TM_EVENT_ZONE_MEMBERS: "${POL_TM_EVENT_ZONE_MEMBERS:-}"
      POL_TM_EVENT_ZONE_NAME: "${POL_TM_EVENT_ZONE_NAME:-Tournament Hall}"
      POL_TM_EVENT_ROOM_ID: "${POL_TM_EVENT_ROOM_ID:-81}"
      # a fixed daily UTC window "HH:MM-HH:MM" instead of the event calendar
      POL_TM_EVENT_WINDOW: "${POL_TM_EVENT_WINDOW:-}"

  authsess:
    image: crystalmaster:latest
    pull_policy: never
    environment:
      POL_TITLES: tmtitle
      POL_TM_ZONE_HOST: "${POL_TM_ZONE_HOST:-}"
      POL_TM_EVENT_START: "${POL_TM_EVENT_START:--1}"
      POL_TM_EVENT_END: "${POL_TM_EVENT_END:--1}"
      POL_TM_EVENT_ZONE_MEMBERS: "${POL_TM_EVENT_ZONE_MEMBERS:-}"
      POL_TM_EVENT_ZONE_NAME: "${POL_TM_EVENT_ZONE_NAME:-Tournament Hall}"
      POL_TM_EVENT_ROOM_ID: "${POL_TM_EVENT_ROOM_ID:-81}"
      POL_TM_EVENT_WINDOW: "${POL_TM_EVENT_WINDOW:-}"
      # the tournament's entry card picker: 1 = everyone, or a member list
      POL_TM_EVENT_DECK_PICK: "${POL_TM_EVENT_DECK_PICK:-0}"
      POL_TM_EVENT_DECK_PICK_MEMBERS: "${POL_TM_EVENT_DECK_PICK_MEMBERS:-}"

  # THE WEEKLY TALLY. Tetra Master's ranking lists are rebuilt once a week
  # (Sunday 00:05 UTC, as the original service did), out of band: the row
  # count is promised on the auth band and the bytes served on the lobby band
  # seconds later, so a rebuild between the two would hand the client one
  # length and another file. tools/tmrank_job.py sleeps until the next
  # Sunday, publishes, and sleeps again. TM_RANK_AT=now publishes at start
  # too (a fresh server, or after restoring data).
  tmrank:
    image: crystalmaster:latest
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "tools/tmrank_job.py"]
    environment:
      POL_DATA_DIR: /data
      POL_RESOURCE_DIR: /data/resources
      POL_DATABASE_URL: "postgresql://openlobby:${POL_DB_PASSWORD:-openlobby}@postgres:5432/openlobby"
      POL_VALKEY_URL: "valkey://valkey:6379/0"
      TM_RANK_AT: "${TM_RANK_AT:-}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - pol-data:/data
      - pol-logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Optional: the live web board (standings, auctions, matches in progress),
  # drawn with art baked from your own client (tools/tm_boardart_bake.py).
  #   docker compose ... --profile board up -d
  board:
    image: crystalmaster:latest
    pull_policy: never
    restart: unless-stopped
    profiles: ["board"]
    entrypoint: ["python", "polboards.py", "--bind", "0.0.0.0",
                 "--tm-port", "8793"]
    environment:
      POL_DATA_DIR: /data
      # the players' names and portraits come from the account tables, and
      # the Discord bookkeeping goes to the tm_board_state table
      POL_DATABASE_URL: "postgresql://openlobby:${POL_DB_PASSWORD:-openlobby}@postgres:5432/openlobby"
      POL_VALKEY_URL: "valkey://valkey:6379/0"
      POL_BOARDS_TM_URL: "${POL_BOARDS_TM_URL:-}"
      POL_BOARDS_TM_DISCORD_WEBHOOK: "${POL_BOARDS_TM_DISCORD_WEBHOOK:-}"
      POL_BOARDS_TM_AUCTION_DISCORD_WEBHOOK: "${POL_BOARDS_TM_AUCTION_DISCORD_WEBHOOK:-}"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - pol-data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
